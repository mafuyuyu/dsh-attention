# dsh-attention：答题倒计时 + 权限审批提醒。
# 安装为 bundle 时由插件管理器读取本文件插入插件行。
- insert:
    - id: attention
      name: 'dsh-attention'
      config:
        fallbackWindowMs: 600000
        answer:
          enabled: true
          volume: 0.7
          countdownEnabled: true
          countdownSeconds: 10
          audioFile: ''
          systemNotification: false
        approval:
          enabled: true
          volume: 0.7
          repeatEnabled: true
          intervalSeconds: 60
          audioFile: ''
          systemNotification: false